name: ${PROJECT_NAME:-diode}

services:
  ingress-nginx:
    image: nginx:latest
    restart: on-failure
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DIODE_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - diode-auth
      - diode-ingester
      - diode-reconciler
    networks:
      - application
      - backend

  diode-ingester:
    image: netboxlabs/diode-ingester:${DIODE_TAG:-latest}
    restart: on-failure
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-self-hosted}
      TELEMETRY_METRICS_EXPORTER: ${TELEMETRY_METRICS_EXPORTER:-none}
      TELEMETRY_TRACES_EXPORTER: ${TELEMETRY_TRACES_EXPORTER:-none}
    depends_on:
      - redis
      - diode-reconciler
    networks:
      - backend

  diode-reconciler:
    image: netboxlabs/diode-reconciler:${DIODE_TAG:-latest}
    restart: on-failure
    environment:
      DIODE_AUTH_TOKEN_URL: ${DIODE_AUTH_TOKEN_URL:-http://diode-auth/token}
      DIODE_TO_NETBOX_CLIENT_ID: ${DIODE_TO_NETBOX_CLIENT_ID}
      DIODE_TO_NETBOX_CLIENT_SECRET: ${DIODE_TO_NETBOX_CLIENT_SECRET}
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}
      NETBOX_DIODE_PLUGIN_API_BASE_URL: ${NETBOX_DIODE_PLUGIN_API_BASE_URL}
      NETBOX_DIODE_PLUGIN_SKIP_TLS_VERIFY: ${NETBOX_DIODE_PLUGIN_SKIP_TLS_VERIFY:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: ${DIODE_POSTGRES_DB_NAME:-diode}
      POSTGRES_USER: ${DIODE_POSTGRES_USER:-diode}
      POSTGRES_PASSWORD: ${DIODE_POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RECONCILER_RATE_LIMITER_BURST: ${RECONCILER_RATE_LIMITER_BURST:-20}
      RECONCILER_RATE_LIMITER_RPS: ${RECONCILER_RATE_LIMITER_RPS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-self-hosted}
      TELEMETRY_METRICS_EXPORTER: ${TELEMETRY_METRICS_EXPORTER:-none}
      TELEMETRY_TRACES_EXPORTER: ${TELEMETRY_TRACES_EXPORTER:-none}
    volumes:
      - ./config/oauth2:/etc/config/oauth2/client:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  redis:
    image: redis/redis-stack-server:latest
    restart: on-failure
    command: ["sh", "-c", "redis-server --appendonly yes --dir /data --save 60 1 --requirepass '$$REDIS_PASSWORD' --port 6379"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - diode-redis-data:/data
    networks:
      - backend

  postgres:
    image: docker.io/postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      DIODE_POSTGRES_USER: ${DIODE_POSTGRES_USER:-diode}
      DIODE_POSTGRES_PASSWORD: ${DIODE_POSTGRES_PASSWORD}
      DIODE_POSTGRES_DB_NAME: ${DIODE_POSTGRES_DB_NAME:-diode}
      HYDRA_POSTGRES_USER: ${HYDRA_POSTGRES_USER:-hydra}
      HYDRA_POSTGRES_PASSWORD: ${HYDRA_POSTGRES_PASSWORD}
      HYDRA_POSTGRES_DB_NAME: ${HYDRA_POSTGRES_DB_NAME:-hydra}
    volumes:
      - diode-postgres-data:/var/lib/postgresql/data
      - ./config/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  hydra:
    image: oryd/hydra:v25.4.0
    restart: on-failure
    command: serve all --dev
    expose:
      - "4444"
      - "4445"
    environment:
      DSN: postgres://${HYDRA_POSTGRES_USER:-hydra}:${HYDRA_POSTGRES_PASSWORD}@postgres:5432/${HYDRA_POSTGRES_DB_NAME:-hydra}?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM}
      URLS_SELF_ISSUER: ${HYDRA_URLS_SELF_ISSUER}
      STRATEGIES_ACCESS_TOKEN: ${HYDRA_STRATEGIES_ACCESS_TOKEN:-jwt}
      STRATEGIES_REFRESH_TOKEN: ${HYDRA_STRATEGIES_REFRESH_TOKEN:-rotate}
      STRATEGIES_JWT_SCOPE_CLAIM: ${HYDRA_STRATEGIES_JWT_SCOPE_CLAIM:-list}
      TTL_ACCESS_TOKEN: ${HYDRA_TTL_ACCESS_TOKEN:-1h}
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: ${HYDRA_SUBJECT_TYPES:-public}
    depends_on:
      - hydra-migrate
    networks:
      - backend

  hydra-migrate:
    image: oryd/hydra:v25.4.0
    restart: on-failure
    command: migrate sql up -e --yes
    environment:
      DSN: postgres://${HYDRA_POSTGRES_USER:-hydra}:${HYDRA_POSTGRES_PASSWORD}@postgres:5432/${HYDRA_POSTGRES_DB_NAME:-hydra}?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM}
      URLS_SELF_ISSUER: ${HYDRA_URLS_SELF_ISSUER}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  diode-auth:
    image: netboxlabs/diode-auth:${DIODE_TAG:-latest}
    restart: on-failure
    environment:
      HTTP_PORT: "80"
      OAUTH2_ADMIN_SERVER_URL: http://hydra:4445
      OAUTH2_PUBLIC_SERVER_URL: http://hydra:4444
      SENTRY_DSN: ${SENTRY_DSN:-}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-self-hosted}
      TELEMETRY_METRICS_EXPORTER: ${TELEMETRY_METRICS_EXPORTER:-none}
      TELEMETRY_TRACES_EXPORTER: ${TELEMETRY_TRACES_EXPORTER:-none}
    depends_on:
      - hydra
      - diode-auth-bootstrap
    networks:
      - backend

  diode-auth-bootstrap:
    image: netboxlabs/diode-auth:${DIODE_TAG:-latest}
    restart: on-failure
    command: ["/bin/sh", "/etc/config/oauth2/bootstrap-clients.sh"]
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
    volumes:
      - ./config/oauth2:/etc/config/oauth2/client:ro
    depends_on:
      - hydra-migrate
    networks:
      - backend

networks:
  application:
    external: true
    name: ${APPLICATION_NETWORK:-application}
  backend:
    internal: true

volumes:
  diode-redis-data:
  diode-postgres-data:
