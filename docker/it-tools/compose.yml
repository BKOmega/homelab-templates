services:
  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${IT_TOOLS_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - tools

networks:
  tools:
    external: true
    name: ${TOOLS_NETWORK:-tools}
