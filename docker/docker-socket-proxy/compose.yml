services:
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_TOP: "0"
      ALLOW_UNPAUSE: "0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: ${ALLOW_CONTAINERS:-1}
      DISTRIBUTION: "0"
      EVENTS: ${ALLOW_EVENTS:-0}
      EXEC: "0"
      IMAGES: ${ALLOW_IMAGES:-0}
      INFO: ${ALLOW_INFO:-0}
      NETWORKS: ${ALLOW_NETWORKS:-0}
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: ${ALLOW_SERVICES:-0}
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: ${ALLOW_TASKS:-0}
      VERSION: "1"
      VOLUMES: ${ALLOW_VOLUMES:-0}
      POST: "0"
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

networks:
  docker-api:
    external: true
    name: ${DOCKER_API_NETWORK:-docker-api}
