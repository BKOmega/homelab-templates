services:
  truecommand:
    image: ghcr.io/ixsystems/truecommand:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./data:/data
    networks:
      - management

networks:
  management:
    external: true
    name: ${MANAGEMENT_NETWORK:-management}
