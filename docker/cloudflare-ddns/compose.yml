services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    restart: always
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAINS: ${DOMAINS}
      PROXIED: ${PROXIED:-true}
