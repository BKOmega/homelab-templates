services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-2019}:2019"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL}
      CROWDSEC_API_KEY: ${CROWDSEC_API_KEY}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://app:8080}
      SITE_HOST: ${SITE_HOST:-app.example.internal}
      RFC2136_SERVER: ${RFC2136_SERVER:-}
      RFC2136_KEY_NAME: ${RFC2136_KEY_NAME:-}
      RFC2136_KEY_ALG: ${RFC2136_KEY_ALG:-hmac-sha256}
      RFC2136_KEY_SECRET: ${RFC2136_KEY_SECRET:-}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config-data:/config
      - ./logs:/var/log/caddy
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
