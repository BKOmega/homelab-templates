services:
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.example.internal}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.example.internal}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_PLUGINS_PREINSTALL: ${GRAFANA_PLUGINS:-}
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${OIDC_NAME:-OpenID Connect}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${OIDC_SCOPES:-openid profile email}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OIDC_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OIDC_API_URL:-}
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${OIDC_SIGNOUT_URL:-}
      GF_AUTH_OAUTH_AUTO_LOGIN: ${OIDC_AUTO_LOGIN:-false}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${OIDC_ROLE_ATTRIBUTE_PATH:-}
    volumes:
      - ./data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring}
