services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    privileged: true
    environment:
      CONTAINERS: "1"
      INFO: "1"
      PING: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dashboard

  homepage:
    image: gethomepage/homepage:latest
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOMEPAGE_PORT:-3000}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000}
    volumes:
      - ./config:/app/config
    networks:
      - dashboard

networks:
  dashboard:
    external: true
    name: ${DASHBOARD_NETWORK:-dashboard}
