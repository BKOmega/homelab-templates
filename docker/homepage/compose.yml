services:
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_TOP: "0"
      ALLOW_UNPAUSE: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      POST: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "1"
      VOLUMES: "0"
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  homepage:
    image: gethomepage/homepage:latest
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOMEPAGE_PORT:-3000}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000}
    volumes:
      - ./config:/app/config
    networks:
      - docker-api
      - dashboard

networks:
  docker-api:
    internal: true
  dashboard:
    external: true
    name: ${DASHBOARD_NETWORK:-dashboard}
